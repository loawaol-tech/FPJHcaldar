<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPJH 公務行事曆系統</title>
    <!-- 使用 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
        .tab-active { border-bottom: 4px solid white; opacity: 1; }
        .tab-inactive { opacity: 0.6; }
        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 讓嵌入日曆在手機上比例正確 */
        .calendar-container {
            position: relative;
            padding-bottom: 75%;
            height: 0;
            overflow: hidden;
        }
        .calendar-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <!-- 頂部導航與標題 -->
    <div class="bg-gradient-to-r from-indigo-600 to-blue-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-2xl mx-auto px-4">
            <div class="flex flex-col items-center pt-6 pb-2">
                <div class="flex items-center gap-3 mb-4">
                    <i data-lucide="calendar" class="w-8 h-8 text-indigo-200"></i>
                    <h1 class="text-xl font-black tracking-wider">校園公務行事曆系統</h1>
                </div>
                
                <!-- 頁籤切換 -->
                <div class="flex w-full justify-around text-sm font-bold">
                    <button onclick="switchTab('register')" id="tab-register" class="pb-3 px-6 tab-active transition-all flex items-center gap-2">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> 登記行程
                    </button>
                    <button onclick="switchTab('view')" id="tab-view" class="pb-3 px-6 tab-inactive transition-all flex items-center gap-2">
                        <i data-lucide="eye" class="w-4 h-4"></i> 確認日曆
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-2xl mx-auto mt-6 px-4">
        
        <!-- 登記行程區域 -->
        <div id="section-register" class="fade-in">
            <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200">
                <!-- 錯誤警告 (預設隱藏) -->
                <div id="errorMessage" class="hidden mx-6 mt-6 p-4 bg-red-50 border-l-4 border-red-500 text-red-700 flex items-center gap-3 animate-pulse">
                    <i data-lucide="alert-circle" class="w-5 h-5 shrink-0"></i>
                    <span id="errorText" class="text-sm font-semibold"></span>
                </div>

                <div id="formContent" class="p-6 md:p-8">
                    <!-- 步驟一內容 -->
                    <div id="step1" class="space-y-6">
                        <div class="space-y-2">
                            <label class="text-sm font-bold text-slate-500 ml-1 italic tracking-widest">STEP 1. 活動基本資訊</label>
                            <div class="space-y-4">
                                <input type="text" id="title" required placeholder="活動名稱 (例如：[教學組] 段考)" 
                                    class="w-full rounded-2xl border-slate-200 shadow-sm p-4 bg-slate-50 border focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none transition-all">
                                
                                <input type="date" id="date" required 
                                    class="w-full rounded-2xl border-slate-200 shadow-sm p-4 bg-slate-50 border focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none">
                                
                                <div class="relative">
                                    <i data-lucide="map-pin" class="absolute left-4 top-4 w-5 h-5 text-slate-400"></i>
                                    <input type="text" id="location" placeholder="地點 (選填，例如：三樓會議室)" 
                                        class="w-full rounded-2xl border-slate-200 shadow-sm pl-12 pr-4 py-4 bg-slate-50 border focus:ring-2 focus:ring-indigo-500 focus:bg-white outline-none">
                                </div>
                            </div>
                        </div>
                        <button onclick="goToStep(2)" id="btnStep1" disabled
                            class="w-full bg-indigo-600 text-white font-bold py-4.5 rounded-2xl hover:bg-indigo-700 disabled:bg-slate-300 shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2 text-lg py-4 mt-4">
                            下一步：設定細節 <i data-lucide="chevron-right" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <!-- 步驟二內容 (預設隱藏) -->
                    <div id="step2" class="hidden space-y-6">
                        <div class="bg-indigo-50 border border-indigo-100 rounded-2xl p-5 mb-2 flex items-start gap-4">
                            <div class="bg-indigo-600/10 p-2.5 rounded-xl text-indigo-600 shrink-0">
                                <i data-lucide="check-square" class="w-6 h-6"></i>
                            </div>
                            <div class="flex-1 min-w-0">
                                <h3 class="text-[11px] font-black text-indigo-400 uppercase tracking-widest mb-1">內容確認</h3>
                                <div id="summaryTitle" class="text-slate-800 font-bold text-lg truncate">---</div>
                                <div id="summaryDate" class="text-sm text-slate-500">---</div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="space-y-1">
                                <label class="text-xs font-bold text-slate-400 ml-1 uppercase">開始時間</label>
                                <input type="time" id="startTime" value="08:00" class="w-full rounded-2xl border border-slate-200 p-4 bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                            <div class="space-y-1">
                                <label class="text-xs font-bold text-slate-400 ml-1 uppercase">結束時間</label>
                                <input type="time" id="endTime" value="09:00" class="w-full rounded-2xl border border-slate-200 p-4 bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500">
                            </div>
                        </div>
                        
                        <textarea id="description" rows="3" placeholder="備註說明 (選填)..." 
                            class="w-full rounded-2xl border border-slate-200 shadow-sm p-4 bg-slate-50 outline-none focus:ring-2 focus:ring-indigo-500"></textarea>

                        <div class="flex gap-4 pt-2">
                            <button onclick="goToStep(1)" class="flex-1 bg-slate-100 text-slate-600 font-bold py-4 rounded-2xl hover:bg-slate-200 transition-colors">
                                返回修改
                            </button>
                            <button onclick="submitForm()" id="submitBtn"
                                class="flex-[2] bg-indigo-600 text-white font-bold py-4 rounded-2xl hover:bg-indigo-700 shadow-lg shadow-indigo-200 flex items-center justify-center gap-2">
                                <span>確認並發布</span>
                            </button>
                        </div>
                    </div>

                    <!-- 步驟三：提交成功 -->
                    <div id="step3" class="hidden text-center py-10">
                        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6 text-green-600">
                            <i data-lucide="check-circle" class="w-12 h-12"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-800">登錄成功！</h2>
                        <p class="text-slate-500 mt-2 italic px-4">資料已同步至公務日曆</p>
                        
                        <div class="mt-8 flex flex-col gap-3">
                            <button onclick="resetForm()" class="bg-indigo-600 text-white font-bold py-4 rounded-2xl hover:bg-indigo-700">
                                繼續登記下一筆
                            </button>
                            <button onclick="switchTab('view')" class="text-indigo-600 font-bold py-3">
                                立即查看日曆確認 <i data-lucide="arrow-right" class="w-4 h-4 inline"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 查看日曆區域 (預設隱藏) -->
        <div id="section-view" class="hidden fade-in">
            <div class="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-200 p-2">
                <div class="bg-slate-50 p-4 rounded-2xl mb-2 flex items-center justify-between">
                    <span class="text-sm font-bold text-slate-600 flex items-center gap-2">
                        <i data-lucide="info" class="w-4 h-4 text-indigo-500"></i>
                        提示：請確認日曆內是否有您的行程
                    </span>
                    <button onclick="refreshCalendar()" class="p-2 hover:bg-slate-200 rounded-full transition-colors">
                        <i data-lucide="refresh-cw" class="w-4 h-4 text-slate-400"></i>
                    </button>
                </div>
                
                <!-- 嵌入 Google 日曆 -->
                <!-- 請將下方的 src 替換成您的公務日曆嵌入碼 -->
                <div class="calendar-container rounded-xl overflow-hidden border border-slate-100">
                    <iframe id="calendar-iframe" 
                        src="https://calendar.google.com/calendar/embed?src=您的日曆ID&ctz=Asia%2FTaipei&mode=AGENDA" 
                        style="border: 0" frameborder="0" scrolling="no"></iframe>
                </div>
                
                <div class="p-4 text-center">
                    <a href="https://calendar.google.com/calendar/u/0/r" target="_blank" class="text-indigo-600 text-xs font-bold flex items-center justify-center gap-1">
                        在新視窗中開啟完整日曆 <i data-lucide="external-link" class="w-3 h-3"></i>
                    </a>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- 設定區 ---
        // 1. 您的 GAS 網址
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw4s9xtg5XSQwOKnNeUYm2bzJ8cEkpUA9QsdXkMsfRKDdelKLExx_bzqdxrjfsRRi4/exec";
        // 2. 您的日曆嵌入連結 (可以從 Google 日曆設定中取得)
        const CALENDAR_EMBED_URL = "https://calendar.google.com/calendar/embed?src=您的日曆ID&ctz=Asia%2FTaipei&mode=AGENDA";

        // 初始化
        lucide.createIcons();
        const titleInput = document.getElementById('title');
        const dateInput = document.getElementById('date');
        const btnStep1 = document.getElementById('btnStep1');

        function checkForm1() {
            btnStep1.disabled = !(titleInput.value && dateInput.value);
        }
        titleInput.addEventListener('input', checkForm1);
        dateInput.addEventListener('input', checkForm1);

        // 分頁切換邏輯
        function switchTab(target) {
            const secReg = document.getElementById('section-register');
            const secView = document.getElementById('section-view');
            const tabReg = document.getElementById('tab-register');
            const tabView = document.getElementById('tab-view');

            if (target === 'register') {
                secReg.classList.remove('hidden');
                secView.classList.add('hidden');
                tabReg.classList.add('tab-active');
                tabReg.classList.remove('tab-inactive');
                tabView.classList.remove('tab-active');
                tabView.classList.add('tab-inactive');
            } else {
                secReg.classList.add('hidden');
                secView.classList.remove('hidden');
                tabReg.classList.remove('tab-active');
                tabReg.classList.add('tab-inactive');
                tabView.classList.add('tab-active');
                tabView.classList.remove('tab-inactive');
                // 切換到查看時自動重新整理日曆
                refreshCalendar();
            }
        }

        function refreshCalendar() {
            const iframe = document.getElementById('calendar-iframe');
            const currentSrc = iframe.src;
            iframe.src = ''; // 先清空
            setTimeout(() => { iframe.src = currentSrc; }, 100); // 重新載入
        }

        function goToStep(step) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.add('hidden');

            if (step === 1) {
                document.getElementById('step1').classList.remove('hidden');
            } else if (step === 2) {
                document.getElementById('summaryTitle').innerText = titleInput.value;
                document.getElementById('summaryDate').innerText = dateInput.value;
                document.getElementById('step2').classList.remove('hidden');
            } else if (step === 3) {
                document.getElementById('step3').classList.remove('hidden');
            }
            lucide.createIcons();
        }

        async function submitForm() {
            const submitBtn = document.getElementById('submitBtn');
            const originalHTML = submitBtn.innerHTML;
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i data-lucide="loader-2" class="animate-spin w-5 h-5"></i> 同步中...`;
            lucide.createIcons();

            const formData = {
                title: titleInput.value,
                date: dateInput.value,
                location: document.getElementById('location').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value,
                description: document.getElementById('description').value
            };

            try {
                const params = new URLSearchParams();
                params.append('jsonData', JSON.stringify(formData));

                await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params.toString()
                });

                setTimeout(() => {
                    goToStep(3);
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalHTML;
                    lucide.createIcons();
                }, 1500);

            } catch (error) {
                document.getElementById('errorMessage').classList.remove('hidden');
                document.getElementById('errorText').innerText = "系統忙碌中，請稍後再試。";
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalHTML;
                lucide.createIcons();
            }
        }

        function resetForm() {
            titleInput.value = "";
            dateInput.value = "";
            document.getElementById('location').value = "";
            document.getElementById('description').value = "";
            document.getElementById('errorMessage').classList.add('hidden');
            checkForm1();
            goToStep(1);
        }
    </script>
</body>
</html>
